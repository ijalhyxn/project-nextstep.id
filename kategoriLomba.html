<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="kategori-container">
    <h3 class="label-kategori">Temukan Berdasarkan Kategori</h3>
    
    <div class="row-kategori">
        <button class="btn-kategori" onclick="filterLomba('Finance & Business')">
            <img src="ikon uang lomba.png" alt="Icon" class="icon-kiri">
            <span class="text-kategori">Finance & Business</span>
            <span class="icon-panah">&gt;</span>
        </button>

        <button class="btn-kategori" onclick="filterLomba('Academics')">
            <img src="ikon academics lomba.png" alt="Icon" class="icon-kiri">
            <span class="text-kategori">Academics</span>
            <span class="icon-panah">&gt;</span>
        </button>

        <button class="btn-kategori" onclick="filterLomba('Creative')">
            <img src="ikon creative lomba.png" alt="Icon" class="icon-kiri">
            <span class="text-kategori">Creative</span>
            <span class="icon-panah">&gt;</span>
        </button>

        <button class="btn-kategori" onclick="filterLomba('Technology')">
            <img src="ikon teknologi lomba.png" alt="Icon" class="icon-kiri">
            <span class="text-kategori">Technology</span>
            <span class="icon-panah">&gt;</span>
        </button>
    </div>
</div>
    
</body>
</html>
